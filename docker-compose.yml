# Run local Compose from the project root; see docs/local-docker.md.
x-app: &x-app
  build:
    context: .
    target: dev
  tty: true
  image: ${COMPOSE_PROJECT_NAME:?Use ./dockerized.sh}-app
  environment: &ruby-environment
    BUNDLE_PATH: ${DOCKER_BUNDLE_DIR:?Use ./dockerized.sh}
    GEM_HOME: ${DOCKER_BUNDLE_DIR:?Use ./dockerized.sh}
    XDG_CACHE_HOME: ${DOCKER_CACHE_DIR:?Use ./dockerized.sh}
    RUBOCOP_CACHE_ROOT: ${DOCKER_CACHE_DIR:?Use ./dockerized.sh}/rubocop
    BUNDLE_IGNORE_CONFIG: "true"
    BUNDLE_AUTO_INSTALL: "false"
  # Rootless Docker maps container root to the unprivileged host user.
  user: "0:0"
  working_dir: ${PWD:?Run Compose from the project root}
  volumes:
    - type: bind
      source: .
      target: ${PWD:?Run Compose from the project root}
      bind:
        create_host_path: false

services:
  app:
    <<: *x-app
    env_file:
      - .env
    entrypoint:
    command:
      - sh
      - -c
      - sleep infinity
  jekyll:
    <<: *x-app
    ports:
      - "127.0.0.1:4001:4000"
      - "127.0.0.1:35729:35729"
    environment:
      <<: *ruby-environment
      BACKEND_HOST: "http://localhost:4001"
      JEKYLL_ENV: development
    command:
      - watchexec
      - --restart
      - --watch
      - .
      - -f
      - events_listing/_plugins/**/*.rb
      - -f
      - events.csv
      - -f
      - Gemfile.lock
      - -f
      - events_listing/_config.yml
      - --
      - bundle
      - exec
      - jekyll
      - server
      - --force_polling
      - -l
      - -H
      - 0.0.0.0
      - -s
      - events_listing
  sinatra:
    <<: *x-app
    ports:
      - "127.0.0.1:4002:4567"
    env_file:
      - .env
    environment:
      <<: *ruby-environment
      ALLOWED_ORIGIN: "http://localhost:4001"
    command:
      - watchexec
      - --restart
      - --watch
      - .
      - -f
      - bin/server.rb
      - -f
      - lib/server/**/*.rb
      - -f
      - lib/event_schema.json
      - --
      - ruby
      - bin/server.rb

  # Share development files/image, with no app boot, network or app credentials.
  editor:
    extends:
      service: app
    profiles: [editor]
    network_mode: none
    # No build definition: --pull never cannot fall back to building an editor image.
    build: !reset null
    ports: !reset []
    env_file: !reset []
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,exec
    environment:
      HOME: /tmp
      BUNDLE_FROZEN: "true"
      BUNDLE_GEMFILE: ${PWD:?Use ./dockerized.sh}/Gemfile
    entrypoint: !reset []
    command: ["bundle", "exec", "ruby-lsp"]
