name: Docker Checks

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - 'events.csv'
      - 'images/**'
      - 'events_listing/**'
  pull_request:
    paths-ignore:
      - 'events.csv'
      - 'images/**'
      - 'events_listing/**'

env:
  COMPOSE_DOCKER_CLI_BUILD: 1
  OLD_VERSIONS_TO_KEEP: 10
  DOCKER_BUILD_CHECKS_ANNOTATIONS: false

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      production: ${{ steps.detect.outputs.production }}
      docker_lint: ${{ steps.detect.outputs.docker_lint }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect production deployment changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          ZERO_SHA: '0000000000000000000000000000000000000000'
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "production=true" >> "$GITHUB_OUTPUT"
            echo "docker_lint=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${EVENT_NAME}" = "pull_request" ]; then
            git fetch --no-tags origin "${BASE_REF}"
            changed_files="$(git diff --name-only "origin/${BASE_REF}"...HEAD)"
          elif [ "${BEFORE_SHA}" = "${ZERO_SHA}" ]; then
            changed_files="$(jq -r '[.commits[]? | (.added[]?, .modified[]?, .removed[]?)] | unique | .[]' "$GITHUB_EVENT_PATH")"
          else
            changed_files="$(gh api "repos/${REPOSITORY}/compare/${BEFORE_SHA}...${TARGET_SHA}" --jq '.files[].filename')"
          fi

          production=false
          docker_lint=false
          while IFS= read -r path; do
            case "$path" in
              Dockerfile|.dockerignore|Gemfile|Gemfile.lock|bin/server.rb|lib/server/*|.github/workflows/docker_checks.yml)
                production=true
                ;;
            esac

            case "$path" in
              Dockerfile|.dockerignore|.hadolint.yaml|docker-compose*.yml|docker-compose*.yaml|.github/workflows/docker_checks.yml)
                docker_lint=true
                ;;
            esac
          done <<EOF
          ${changed_files}
          EOF

          echo "production=${production}" >> "$GITHUB_OUTPUT"
          echo "docker_lint=${docker_lint}" >> "$GITHUB_OUTPUT"

  docker_lint:
    needs: changes
    if: ${{ needs.changes.outputs.docker_lint == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

      - name: Run droast (Dockerfile linter)
        uses: immanuwell/dockerfile-roast@1.7.0

  tests:
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker-compose.ci.yml
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        id: buildx_test
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          push: false
          load: true
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci
          target: ci
          # Used locally by docker-compose.ci in this job.
          tags: ghcr.io/${{ github.repository }}:ci

      - name: Run Rubocop
        run: |
          docker compose run --rm app bundle exec rubocop

      - name: Run Tests
        run: |
          docker compose run --rm app bundle exec rake test

      - name: Jekyll doctor
        run: |
          docker compose run --rm -e JEKYLL_ENV=production -e COMMIT_SHA=${{ github.sha }} -e BACKEND_HOST=http://sinatra:4567 app bundle exec jekyll doctor --source /app/events_listing

  production_smoke:
    if: >
      always() &&
      needs.changes.result == 'success' &&
      needs.tests.result == 'success' &&
      (needs.docker_lint.result == 'success' || needs.docker_lint.result == 'skipped') &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.production == 'true'
      )
    needs:
      - changes
      - docker_lint
      - tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          push: false
          load: true
          target: live
          tags: ps_events:live-smoke
          cache-from: |
            type=gha,scope=live
            type=gha,scope=ci

      - name: Smoke test production image
        run: |
          docker run --rm --user 1000:1000 -e APP_ENV=test ps_events:live-smoke \
            bundle exec ruby -rrack/mock -e '
              require_relative "bin/server"
              response = Rack::MockRequest.new(Sinatra::Application).get("/health")
              abort response.body unless response.status == 200 && JSON.parse(response.body).fetch("status") == "ok"
              puts response.body
            '

  publish_ci:
    if: >
      always() &&
      needs.changes.result == 'success' &&
      needs.tests.result == 'success' &&
      (needs.docker_lint.result == 'success' || needs.docker_lint.result == 'skipped') &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    needs:
      - changes
      - docker_lint
      - tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CI image
        uses: docker/build-push-action@v7
        with:
          push: true
          target: ci
          tags: ghcr.io/${{ github.repository }}:ci
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci

  push_production:
    if: >
      always() &&
      needs.changes.result == 'success' &&
      needs.tests.result == 'success' &&
      (needs.docker_lint.result == 'success' || needs.docker_lint.result == 'skipped') &&
      needs.publish_ci.result == 'success' &&
      needs.production_smoke.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.production == 'true'
      )
    needs:
      - changes
      - docker_lint
      - tests
      - publish_ci
      - production_smoke
    runs-on: ubuntu-latest
    concurrency:
      group: production-docker
      cancel-in-progress: true
    environment: production
    permissions:
      contents: read
      deployments: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # full length sha
            type=sha,format=long,prefix=
          flavor: |
            latest=true

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          builder: ${{ steps.buildx.outputs.name }}
          target: live
          platforms: linux/amd64
          cache-from: |
            type=gha,scope=live
            type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=live
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_CODE_VERSION=${{ github.sha }}

      - name: Delete old images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          keep-n-tagged: ${{ env.OLD_VERSIONS_TO_KEEP }}
          keep-n-untagged: ${{ env.OLD_VERSIONS_TO_KEEP }}
          exclude-tags: latest
          delete-partial-images: true

      - name: Deploy via webhook
        env:
          deploy_url: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error "$deploy_url"
